<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" aria-label="Michelin Wet tyre">
  <defs>
    <radialGradient id="wet-tire-rubber" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1c1e20"/>
      <stop offset="78%" stop-color="#2a2d30"/>
      <stop offset="94%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#0a0b0c"/>
    </radialGradient>
    <radialGradient id="wet-wheel-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060708"/>
      <stop offset="70%" stop-color="#15171a"/>
      <stop offset="92%" stop-color="#1f2226"/>
      <stop offset="100%" stop-color="#0e1012"/>
    </radialGradient>
    <radialGradient id="wet-hub-bowl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="60%" stop-color="#15171a"/>
      <stop offset="100%" stop-color="#2a2d32"/>
    </radialGradient>
    <!-- Text paths for the authentic curved sticker decal -->
    <path id="wet-sticker-brand" d="M 97,76 A 158,158 0 0,1 303,76" />
    <path id="wet-sticker-sub" d="M 115,98 A 133,133 0 0,1 285,98" />
    <path id="wet-compound-text" d="M 100,320 A 150,150 0 0,0 300,320" />
  </defs>

  <!-- Outer Tyre Body -->
  <circle cx="200" cy="200" r="195" fill="url(#wet-tire-rubber)" />
  
  <!-- Wet Tyre Deep Shoulder Tread Grooves / Water Drainage Channels -->
  <g stroke="#090a0c" stroke-width="12" stroke-linecap="round">
    <circle cx="200" cy="200" r="193" fill="none" stroke-dasharray="5 21" />
  </g>
  <g stroke="#101114" stroke-width="8" stroke-linecap="round">
    <circle cx="200" cy="200" r="184" fill="none" stroke-dasharray="3 23" stroke-dashoffset="11" />
  </g>

  <circle cx="200" cy="200" r="186" fill="none" stroke="#2b2e31" stroke-width="5" opacity="0.4" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#1d2022" stroke-width="4" opacity="0.6" />
  
  <!-- Sidewall Velvet Recess Band -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#25282b" stroke-width="32" opacity="0.5" />
  <circle cx="200" cy="200" r="132" fill="none" stroke="#1b1d1f" stroke-width="2" opacity="0.7" />

  <!-- Wheel Rim Flange and Stepped Motorsport Barrel (Authentic 18-inch Track Wheel) -->
  <circle cx="200" cy="200" r="124" fill="none" stroke="#08090a" stroke-width="4" />
  <circle cx="200" cy="200" r="121" fill="url(#wet-wheel-rim)" stroke="#42474e" stroke-width="2.5" />
  <circle cx="200" cy="200" r="115" fill="#0c0d0f" stroke="#1c1e22" stroke-width="1.5" />
  
  <!-- Carbon-Ceramic Slotted Brake Rotor & Brembo-Style Monobloc Caliper Behind Spokes -->
  <circle cx="200" cy="200" r="106" fill="#141618" stroke="#25292e" stroke-width="1.5" />
  <circle cx="200" cy="200" r="97" fill="none" stroke="#22262b" stroke-width="14" opacity="0.65" />
  <!-- Directional Brake Cooling Slots -->
  <g stroke="#0f1012" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M 194,108 C 196,117 200,125 205,133" />
    <path d="M 238,124 C 235,133 230,142 224,150" />
    <path d="M 256,168 C 248,172 239,178 230,183" />
    <path d="M 248,214 C 238,214 228,216 218,216" />
    <path d="M 216,252 C 213,242 208,234 201,227" />
    <path d="M 172,256 C 176,246 182,238 189,230" />
    <path d="M 144,222 C 152,217 160,211 169,206" />
    <path d="M 148,174 C 158,175 168,173 178,173" />
  </g>
  <!-- Monobloc Endurance Brake Caliper -->
  <path
    d="M 103,173 C 100,141 119,112 148,100 L 157,115 C 133,125 119,147 121,171 Z"
    fill="#1c2024"
    stroke="#383e46"
    stroke-width="1.5"
  />
  <circle cx="118" cy="148" r="2.2" fill="#5a616b" />
  <circle cx="132" cy="126" r="2.2" fill="#5a616b" />

  <!-- Forged Racing Wheel: 5 Sculpted Split Y-Spokes (10 Arms) -->
  <g id="wet-spoke-def" style="display:none">
    <g id="wet-spoke">
      <!-- Main Solid Forged Spoke Body -->
      <path
        d="M 191,158 L 191,126 L 169,82 L 180,80 L 198,118 L 202,118 L 220,80 L 231,82 L 209,126 L 209,158 Z"
        fill="#26292e"
        stroke="#1a1c1e"
        stroke-width="1"
      />
      <!-- Machined Outer Bevel / Highlight on Spoke Edges -->
      <path
        d="M 191,158 L 191,126 L 169,82 M 209,158 L 209,126 L 231,82"
        fill="none"
        stroke="#4a5058"
        stroke-width="1.75"
        stroke-linecap="round"
      />
      <!-- Inner Fork Rim Bevel -->
      <path
        d="M 180,80 L 198,118 L 202,118 L 220,80"
        fill="none"
        stroke="#363a40"
        stroke-width="1.2"
      />
      <!-- Recessed Lightweight Pocket in Spoke Stem -->
      <rect x="195" y="130" width="10" height="22" rx="2" fill="#151719" stroke="#1d2023" stroke-width="1" />
    </g>
  </g>
  <g id="wet-spokes-group">
    <use href="#wet-spoke" />
    <use href="#wet-spoke" transform="rotate(72 200 200)" />
    <use href="#wet-spoke" transform="rotate(144 200 200)" />
    <use href="#wet-spoke" transform="rotate(216 200 200)" />
    <use href="#wet-spoke" transform="rotate(288 200 200)" />
  </g>

  <!-- Deep-Dish Center Hub Assembly -->
  <circle cx="200" cy="200" r="45" fill="url(#wet-hub-bowl)" stroke="#383d44" stroke-width="2.5" />
  <circle cx="200" cy="200" r="38" fill="#101113" stroke="#222529" stroke-width="1.5" />
  
  <!-- 5 Center Drive Pin Recesses -->
  <g fill="#060708" stroke="#1e2124" stroke-width="1">
    <circle cx="200" cy="173" r="3.2" />
    <circle cx="226" cy="191" r="3.2" />
    <circle cx="216" cy="222" r="3.2" />
    <circle cx="184" cy="222" r="3.2" />
    <circle cx="174" cy="191" r="3.2" />
  </g>
  <!-- Center-Lock Motorsport Hex Drive Nut -->
  <polygon points="200,181 216.5,190.5 216.5,209.5 200,219 183.5,209.5 183.5,190.5" fill="#24282d" stroke="#505660" stroke-width="1.75" />
  <!-- Anodized Safety Core Center Lock Spindle -->
  <circle cx="200" cy="200" r="11" fill="#c62828" stroke="#8e1b1b" stroke-width="1.5" />
  <circle cx="200" cy="200" r="5" fill="#0f1113" />

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- AUTHENTIC MICHELIN PILOT SPORT TYRE STICKER BADGE                       -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  
  <!-- Decal Plate: Deep Motorsport Blue Upper Section -->
  <path
    d="M 87,65 A 176,176 0 0,1 313,65 L 290,93 A 140,140 0 0,0 110,93 Z"
    fill="#002B66"
    stroke="#00183b"
    stroke-width="1"
  />

  <!-- Decal Plate: Motorsport Yellow Lower Stripe Accent -->
  <path
    d="M 110,93 A 140,140 0 0,1 290,93 L 280,107 A 124,124 0 0,0 120,107 Z"
    fill="#FFD200"
    stroke="#d9b300"
    stroke-width="0.75"
  />

  <!-- Flanking Motorsport Slash Decal Accents -->
  <g transform="translate(80, 78) rotate(-32)">
    <rect x="-8" y="-3" width="7" height="6" rx="1" fill="#FFD200" />
    <rect x="1" y="-3" width="9" height="6" rx="1" fill="#002B66" />
  </g>
  <g transform="translate(320, 78) rotate(32)">
    <rect x="-10" y="-3" width="9" height="6" rx="1" fill="#002B66" />
    <rect x="1" y="-3" width="7" height="6" rx="1" fill="#FFD200" />
  </g>

  <!-- Line 1: MICHELIN Branding Typography (White on Blue) -->
  <text
    font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
    font-weight="900"
    font-style="italic"
    font-size="22"
    fill="#FFFFFF"
    letter-spacing="2.5"
    dominant-baseline="middle"
  >
    <textPath href="#wet-sticker-brand" startOffset="50%" text-anchor="middle">
      MICHELIN
    </textPath>
  </text>

  <!-- Line 2: PILOT SPORT Lettering (Navy on Yellow Stripe) -->
  <text
    font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
    font-weight="900"
    font-style="italic"
    font-size="12.5"
    fill="#002B66"
    letter-spacing="2"
    dominant-baseline="middle"
  >
    <textPath href="#wet-sticker-sub" startOffset="50%" text-anchor="middle">
      PILOT SPORT
    </textPath>
  </text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- WEC REFERENCE COMPOUND MARKINGS - WET = BLUE                            -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <g stroke="#0288D1" stroke-width="12" fill="none" opacity="0.95" stroke-linecap="round">
    <path d="M 28,200 A 172,172 0 0,1 55,108" />
    <path d="M 372,200 A 172,172 0 0,1 345,292" />
  </g>
  <g stroke="#0288D1" stroke-width="4" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M 37,200 A 163,163 0 0,1 58,124" />
    <path d="M 363,200 A 163,163 0 0,1 342,276" />
  </g>

  <!-- Bottom Compound Identifier -->
  <text
    font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
    font-weight="800"
    font-style="italic"
    font-size="15"
    fill="#0288D1"
    letter-spacing="3"
    dominant-baseline="middle"
    opacity="0.9"
  >
    <textPath href="#wet-compound-text" startOffset="50%" text-anchor="middle">
      WET
    </textPath>
  </text>
</svg>
